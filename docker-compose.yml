services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moodify
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  moodify-backend:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/moodify?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports: ["8080:8080"]
