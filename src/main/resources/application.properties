spring.application.name=Moodify

# ===============================
# Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moodify?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:8080}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JSON
# ===============================
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Spotify Integration
# ===============================
app.spotify.client-id=${SPOTIFY_CLIENT_ID:}
app.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
app.spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/spotify/callback}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}