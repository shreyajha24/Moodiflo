spring.application.name=Moodiflo

# ===============================
# Server & Port (Render dynamic port compatibility)
# ===============================
server.port=${PORT:8080}

# ===============================
# Database
# ===============================
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moodify?createDatabaseIfNotExist=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:8080}


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JSON
# ===============================
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===============================
# Swagger
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Spotify Integration
# ===============================
app.spotify.client-id=${SPOTIFY_CLIENT_ID:}
app.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
app.spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/spotify/callback}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Placeholder/demo catalog data is disabled by default. Production must never
# fall back to local demo tracks when Spotify has no results.
app.demo-mode=${DEMO_MODE:false}
app.purge-legacy-demo-data=${PURGE_LEGACY_DEMO_DATA:false}

# Server-side translation provider
app.translation.url=${TRANSLATION_URL:https://api.mymemory.translated.net/get}

# Optional provider-based discovery. External providers fail soft and Spotify remains the playback catalog.
app.discovery.enabled=${DISCOVERY_EXTERNAL_PROVIDERS_ENABLED:true}
app.discovery.mood-enabled=${MOOD_DISCOVERY_ENABLED:true}
app.discovery.sargam-enabled=${SARGAM_EXTERNAL_DISCOVERY_ENABLED:true}
app.discovery.lastfm-api-key=${LASTFM_API_KEY:}
app.discovery.lastfm-base-url=${LASTFM_BASE_URL:https://ws.audioscrobbler.com/2.0/}
app.discovery.musicbrainz-base-url=${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2/}
app.discovery.musicbrainz-user-agent=${MUSICBRAINZ_USER_AGENT:Moodiflo/1.0 (contact@example.com)}

# Google is opt-in; MyMemory remains the compatible fallback when it is not configured.
app.translation.google-enabled=${GOOGLE_TRANSLATION_ENABLED:false}
app.translation.google-project=${GOOGLE_CLOUD_PROJECT:}
app.translation.google-credentials=${GOOGLE_APPLICATION_CREDENTIALS:}
