<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 64" role="img" aria-labelledby="title desc">
  <title id="title">Moodiflo logo</title>
  <desc id="desc">A continuous colorful ribbon shaped like an M and a soundwave</desc>
  <defs>
    <linearGradient id="moodiflo-ribbon" x1="7" y1="50" x2="69" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".45" stop-color="#6366f1"/>
      <stop offset=".72" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="moodiflo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="moodiflo-highlight" x1="12" y1="17" x2="66" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".42"/>
    </linearGradient>
  </defs>
  <path
    d="M5 38c3-1 5-5 7-13 1.5-6 5.8-6.5 8.2-.7l4.3 10.4c2.1 5 5.5 4.9 7.4-.3l5.3-14.8c1.8-5.1 5.8-5.1 7.5.1l3.1 9.4c1.8 5.5 5.9 6.5 9.5 2.2 2.5-3 4.5-3.7 7.7-2.5"
    fill="none"
    stroke="url(#moodiflo-ribbon)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="11"
    filter="url(#moodiflo-glow)"
  />
  <path
    d="M6 37c3-1 5-5 7-12 1.5-5 4-5.2 6-.3l5 11c2.2 4.5 4.5 4.2 6.2-.5l5.5-15c1.6-4.3 4-4.2 5.7.5l3 9.3c1.9 5.2 5 6.2 8.5 2.4 2.3-2.5 4-3.2 7-2.5"
    fill="none"
    stroke="url(#moodiflo-highlight)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="2.4"
    opacity=".75"
  />
</svg>
